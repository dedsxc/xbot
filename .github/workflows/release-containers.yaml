name: "Release docker image"

on:
  push:
    branches:
      - "main"
    paths:
      - "src/**"
      - "Dockerfile"

# need for release-please action
permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write
  actions: write
  pull-requests: read

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_REGISTRY_REPO: dedsxc

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      paths_released: ${{ steps.release-please.outputs.paths_released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Generate Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: "${{ secrets.BOT_APP_ID }}"
          private-key: "${{ secrets.BOT_APP_PRIV_KEY }}"

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release-please
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Advanced configuration: https://github.com/googleapis/release-please/blob/main/docs/manifest-releaser.md
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json


  # Run the following section to push docker image if a release is created
  release-docker-image:
    name: Release docker image
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.paths_released != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        containers: ${{ fromJson(needs.release-please.outputs.paths_released) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Get repository name
        id: get_repo_name
        run: |
          result=$(echo "$GITHUB_REPOSITORY" | awk -F'/' '{print $2}')
          echo "repo_name=$result" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Configure Docker
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: dedsxc
          password: ${{ secrets.CI_BOT_TOKEN }}

      - name: Build-Push image
        run: |
          app_version=$(cat .github/.release-please-manifest.json | jq -r --arg key "src" '.[$key]')
          platform=$(cat ./containers/xbot/PLATFORM)
          container_name=xbot
          docker buildx build --push --platform $platform -t ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REGISTRY_REPO }}/$container_name:$app_version -f ./containers/$container_name/Dockerfile .
