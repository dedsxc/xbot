name: Build docker image

on: 
  pull_request:
    paths:
      - 'src/**'
      - 'Dockerfile'

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_REGISTRY_REPO: ${{ secrets.GHCR_REPO }}
  DOCKERFILE_PATH: Dockerfile

jobs:
  build-dev-docker-image:
    runs-on: ubuntu-latest
    steps:   
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Get repository name
        id: get_repo_name
        run: |
          result=$(echo "$GITHUB_REPOSITORY" | awk -F'/' '{print $2}')
          echo "repo_name=$result" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Configure Docker
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ secrets.CI_BOT_USERNAME }}
          password: ${{ secrets.CI_BOT_TOKEN }}
      
      - name: Build Docker image
        run: |
          # --load only supports a single platform, so build/scan linux/amd64 even if PLATFORM lists more
          docker buildx build --load --platform linux/amd64 -t ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REGISTRY_REPO }}/${{ steps.get_repo_name.outputs.repo_name }}:pr-${{ github.event.pull_request.number }} -f ./containers/xbot/Dockerfile .

      # Setup and run vulnerability scanner
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        id: trivy_scanner
        with:
          image-ref: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_REGISTRY_REPO }}/${{ steps.get_repo_name.outputs.repo_name }}:pr-${{ github.event.pull_request.number }}
          format: json
          output: 'trivy-results.json'
          vuln-type: 'os,library'
          # severity: 'CRITICAL,HIGH'

      - name: Build PR comment body
        if: always()
        run: |
          critical=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-results.json)
          high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-results.json)
          medium=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' trivy-results.json)
          low=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="LOW")] | length' trivy-results.json)
          total=$((critical + high + medium + low))

          {
            echo "### 🔍 Trivy scan: \`${{ steps.get_repo_name.outputs.repo_name }}\`"
            echo
            echo "🔴 Critical: **$critical** &nbsp; 🟠 High: **$high** &nbsp; 🟡 Medium: **$medium** &nbsp; ⚪ Low: **$low**"
            echo
            if [ "$total" -eq 0 ]; then
              echo "✅ No vulnerabilities found."
            else
              echo "<details><summary>Show $total vulnerabilities</summary>"
              echo
              echo "| Severity | Package | Vulnerability | Installed | Fixed |"
              echo "|---|---|---|---|---|"
              jq -r '
                def sev_rank: {"CRITICAL":0,"HIGH":1,"MEDIUM":2,"LOW":3,"UNKNOWN":4};
                [.Results[]?.Vulnerabilities[]?] | sort_by(sev_rank[.Severity]) | .[] |
                "| \(.Severity) | \(.PkgName) | [\(.VulnerabilityID)](\(.PrimaryURL // "")) | \(.InstalledVersion) | \(.FixedVersion // "-") |"
              ' trivy-results.json
              echo
              echo "</details>"
            fi
          } > trivy-comment.md

      - name: Summary report trivy
        run: cat trivy-comment.md >> $GITHUB_STEP_SUMMARY
      
      - name: Generate Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: "${{ secrets.BOT_APP_ID }}"
          private-key: "${{ secrets.BOT_APP_PRIV_KEY }}"

      - name: Push trivy comment on PR
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: 'trivy-comment.md'
          token: ${{ steps.app-token.outputs.token }}
