version: '3.8'

services:
  redis:
    image: redis:latest@sha256:4764ce37931aac77c0d033680b339b19b4a4a81772204d268947cb851212d0ac
    container_name: redis
    ports:
      - "6379:6379"
  unixbot:
    image: unixbot
    ports:
      - "8000:8000"
    container_name: unixbot
    volumes:
      - ./config.ini:/app/config.ini
    depends_on:
      - redis